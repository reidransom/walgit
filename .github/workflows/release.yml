name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package version
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "RELEASE_DIR=walgit-v${version}-x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
          echo "WALGIT_BUILD_SHA=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install pinned Rust toolchain
        run: rustup show && cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build embedded web UI and SDK
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build
          test -s dist/index.html && test -s dist/repos.js && test -s dist/repos.mjs
      - name: Build release binaries
        run: cargo build --release --locked -p walgit-cli

      - name: Package and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/$RELEASE_DIR"
          install -m 755 target/release/walgit target/release/walgit-server "dist/$RELEASE_DIR/"
          install -m 644 LICENSE README.md walgit.example.toml "dist/$RELEASE_DIR/"
          tar -C dist -czf "dist/$RELEASE_DIR.tar.gz" "$RELEASE_DIR"
          (cd dist && sha256sum "$RELEASE_DIR.tar.gz" > "$RELEASE_DIR.tar.gz.sha256")

      # Exercise the binaries from the archive with the server's required Git >= 2.47.
      # Ubuntu 24.04 ships an older Git; trixie is also the image's runtime base.
      - name: Smoke packaged binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-smoke"
          tar -xzf "dist/$RELEASE_DIR.tar.gz" -C "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/$RELEASE_DIR/walgit" --version | grep -F "$WALGIT_BUILD_SHA"
          "$RUNNER_TEMP/release-smoke/$RELEASE_DIR/walgit-server" --version | grep -F "$WALGIT_BUILD_SHA"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/release-smoke:/release:ro" \
            -w /src \
            -e "WALGIT=/release/$RELEASE_DIR/walgit" \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie-slim bash -ec '
              apt-get update
              apt-get install -y --no-install-recommends git git-lfs curl python3 ca-certificates
              git --version
              dpkg --compare-versions "$(git --version | cut -d " " -f 3)" ge 2.47
              tests/e2e.sh
            '

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/$RELEASE_DIR.tar.gz" "dist/$RELEASE_DIR.tar.gz.sha256" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
